<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBOT Withdraw</title>
    <!-- FontAwesome for the icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mobile Container Simulation */
        .app-container {
            width: 100%;
            max-width: 412px;
            background-color: #0b0c0e;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        /* Header Navigation */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 25px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border: 1px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title {
            font-size: 18px;
            font-weight: 500;
        }

        .placeholder-space {
            width: 36px; /* Balance the back button */
        }

        /* Top Segmented Tabs */
        .tabs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab {
            background-color: #1a1c20;
            border: none;
            border-radius: 12px;
            height: 48px;
            color: #8e9297;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tab.active {
            background-color: #f1b90c;
            color: #000000;
        }

        /* Balance Display Row */
        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #16181c;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .balance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 15px;
        }

        .balance-value {
            font-weight: bold;
            font-size: 15px;
        }

        /* Configuration Cards Block (Yellow Settings) */
        .config-block {
            background-color: #f1b90c;
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            color: #000000;
            cursor: pointer;
            text-decoration: none;
        }

        .config-row:first-child {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .config-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 15px;
        }

        .config-arrow {
            background-color: #000000;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        /* Form Inputs Container */
        .form-container {
            background-color: #16181c;
            border-radius: 20px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #000000;
            font-size: 16px;
            z-index: 2;
        }

        /* Specialized Styling for the lower contrast icon */
        .input-group.dark-bg-input .input-icon {
            color: #a0a5ad;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background-color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 0 20px 0 46px;
            color: #000000;
            font-size: 14px;
            outline: none;
        }

        .form-input::placeholder {
            color: #8e9297;
        }

        /* The last input variant has a darker background */
        .form-input.dark-variant {
            background-color: #272a30;
            color: #ffffff;
            padding-right: 20px;
        }
        
        .form-input.dark-variant::placeholder {
            color: #72767d;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            color: #72767d;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Submit / Confirm Button */
        .submit-btn {
            width: 100%;
            height: 52px;
            background-color: #f1b90c;
            border: none;
            border-radius: 26px;
            color: #000000;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s ease;
        }

        .submit-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navigation Header -->
        <header class="header">
            <button class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
            <h1 class="header-title">Withdraw</h1>
            <div class="placeholder-space"></div>
        </header>

        <!-- Segmented Function Tabs -->
        <div class="tabs-container">
            <button class="tab active"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
            <button class="tab"><i class="fa-solid fa-sun"></i></button>
            <button class="tab"><i class="fa-solid fa-circle-check"></i></button>
        </div>

        <!-- Available Balance Display -->
        <div class="balance-row">
            <div class="balance-label">
                <i class="fa-solid fa-coins" style="color: #f1b90c;"></i>
                <span>Balance</span>
            </div>
            <div class="balance-value">0.2100USDT</div>
        </div>

        <!-- Configuration Settings Card Block -->
        <div class="config-block">
            <div class="config-row">
                <div class="config-left">
                    <i class="fa-solid fa-lock"></i>
                    <span>Payment password</span>
                </div>
                <div class="config-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="config-row">
                <div class="config-left">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Wallet address</span>
                </div>
                <div class="config-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
        </div>

        <!-- Withdrawal Form Block -->
        <form class="form-container" onsubmit="event.preventDefault();">
            <!-- Amount Entry -->
            <div class="input-group">
                <i class="fa-solid fa-database input-icon"></i>
                <input type="text" class="form-input" placeholder="Please enter the withdrawal amount">
            </div>

            <!-- Password Entry -->
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" class="form-input" placeholder="Please enter the payment password">
                <button type="button" class="password-toggle"><i class="fa-regular fa-eye"></i></button>
            </div>

            <!-- Phone Number Entry -->
            <div class="input-group">
                <i class="fa-solid fa-phone input-icon"></i>
                <input type="tel" class="form-input" placeholder="Please enter your phone number">
            </div>

            <!-- Address Entry (Darker variant layout) -->
            <div class="input-group dark-bg-input">
                <i class="fa-solid fa-wallet input-icon"></i>
                <input type="text" class="form-input dark-variant" placeholder="Please enter the withdrawal address">
            </div>

            <!-- Execution Action Button -->
            <button type="submit" class="submit-btn" placeholder="submit">submit
                <i class="fa-solid fa-circle-check"></i>
            </button>
        </form>
    </div>

</body>
</html>
