<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Details UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e11;
            color: #eaeded;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen-container {
            width: 100%;
            max-width: 410px;
            background-color: #050709;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Top Status Bar Placeholder */
        .status-bar {
            height: 30px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #848e9c;
        }

        /* Header Navigation */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }

        .header-icons {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .icon {
            fill: currentColor;
            cursor: pointer;
        }

        /* Main Content Scrollable Area */
        .content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 90px; /* Space for fixed bottom menu */
        }

        /* Wallet Header Card */
        .wallet-card {
            background: linear-gradient(135deg, #161a1e 0%, #101317 100%);
            border: 1px solid #2b3139;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .wallet-logo {
            width: 40px;
            height: 40px;
            background-color: #f3ba2f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-weight: bold;
        }

        .wallet-info-tag {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e2329;
            border: 1px solid #474d57;
            padding: 2px 12px;
            border-radius: 10px;
            font-size: 11px;
            color: #909090;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .wallet-card-title {
            font-size: 16px;
            font-weight: 600;
        }

        /* Deposit Core Card */
        .deposit-card {
            background-color: #161a1e;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .deposit-subtitle {
            font-size: 14px;
            color: #b7bdc6;
        }

        .network-title {
            font-size: 13px;
            color: #848e9c;
        }

        .qr-container {
            background-color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
        }

        .qr-code {
            width: 140px;
            height: 140px;
            background-color: #000; /* Simulated QR pattern box */
            display: flex;
            flex-wrap: wrap;
            padding: 4px;
        }
        
        /* Simulated QR blocks */
        .qr-block { width: 33%; height: 33%; border: 6px solid #fff; box-sizing: border-box;}
        .qr-top-l { border-top: 18px solid #000; border-left: 18px solid #000; }
        .qr-top-r { border-top: 18px solid #000; border-right: 18px solid #000; }
        .qr-bot-l { border-bottom: 18px solid #000; border-left: 18px solid #000; }
        .qr-center { background: repeating-linear-gradient(45deg, #000, #000 4px, #fff 4px, #fff 8px); border: none; width: 100%; height: 60px;}

        /* Address Copy Section */
        .address-box {
            background-color: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 12px;
            width: 100%;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
        }

        .address-text {
            font-size: 12px;
            color: #eaeded;
            word-break: break-all;
            line-height: 1.4;
            font-family: monospace;
        }

        .copy-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            border-left: 1px solid #2b3139;
            padding-left: 12px;
            color: #848e9c;
            cursor: pointer;
            gap: 4px;
        }
        
        .copy-btn:hover {
            color: #f3ba2f;
        }

        .copy-label {
            font-size: 11px;
            white-space: nowrap;
        }

        /* Warning / Info Guidelines */
        .guidelines-card {
            background-color: #161a1e;
            border-radius: 16px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .guideline-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #dbdee3;
        }

        .bullet-point {
            color: #848e9c;
            margin-top: 4px;
            font-size: 8px;
        }

        /* Bottom Floating Menu Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #3b873e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            opacity: 0.9;
            gap: 4px;
        }

        .nav-item:hover {
            opacity: 1;
        }

        .nav-item.center-action {
            font-size: 15px;
            font-weight: 500;
            flex-direction: row;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="content">

            <!-- Copyable Address Element -->
            <div class="address-box">
