<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault Exact</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #080818; color: #fff; min-height: 100vh; }

    /* Lock Screen */
    #lock {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #12122a;
      width: 100%;
      max-width: 360px;
      padding: 30px;
      border-radius: 24px;
      border: 1px solid #2a2a5a;
      text-align: center;
    }
    .card p { color: #888; margin: 10px 0; }

    input {
      width: 100%;
      padding: 15px;
      background: #0a0a1a;
      border: 1px solid #333;
      border-radius: 12px;
      color: #fff;
      margin: 10px 0;
      outline: none;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #6a5cff;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    /* App */
    #app { display: none; padding: 16px; max-width: 420px; margin: 0 auto; }
    .top-label { color: #888; font-size: 12px; margin: 8px 0; }

    .box1 {
      background: linear-gradient(135deg, #4a6bff, #6a8bff);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .box2 {
      background: linear-gradient(135deg, #4a6bff, #6a8bff);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .big { font-size: 28px; font-weight: 800; margin: 6px 0; }
    .small { font-size: 10px; opacity: 0.8; }

    .btns { display: flex; gap: 10px; margin-bottom: 18px; }
    .b { flex: 1; padding: 14px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; }
    .b1 { background: #b6ff7a; color: #000; }
    .b2 { background: #fff; color: #000; }
    .b3 { background: #ffe8c2; color: #000; }

    .live { background: #1a1a32; border-radius: 20px; padding: 16px; }
    .live-header { display: flex; justify-content: space-between; color: #888; font-size: 12px; }
    .progress { height: 4px; background: #333; border-radius: 5px; margin: 6px 0; }
    .progress-fill { width: 60%; height: 100%; background: #b6ff7a; border-radius: 5px; }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lock">
    <div class="card">
      <h2>🔐 Vault Exact</h2>
      <p>Private Access Required</p>
      <input id="pin" type="password" placeholder="Enter Password" />
      <input id="uname" type="text" value="Elon musk spacex" />
      <button onclick="unlock()">Unlock Vault →</button>
    </div>
  </div>

      <button class="b b2" onclick="alert('Tesla invested')">Invest</button>

    <div class="live">

  <script>
    function unlock() {
  const correctPin = String.fromCharCode(55,52,54,57); // 7469
  const enteredPin = document.getElementById('pin').value;
  const userName = document.getElementById('uname').value;

  if (enteredPin !== correctPin) {
    alert('Wrong password!');
    return;
  }
  // save name and go to second page
  localStorage.setItem('vaultUser', userName);
  window.location.href = "second.html";
}
  </script>
</body>
</html>
